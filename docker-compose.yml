# ชื่อ project → ตั้ง prefix ให้ container/volume/network ไม่ชนโปรเจคอื่นบน server รวม
name: primus-chatbot

services:
  db:
    image: postgres:18
    restart: unless-stopped
    # จำกัดขนาด log ไม่ให้โตไม่จำกัด: เก็บ 5 ไฟล์ ไฟล์ละ 10MB (รวมสูงสุด ~50MB) แล้ว rotate ทับของเก่า
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # บังคับ TimeZone ของ server เป็นไทย — image postgres ตั้งต้นเป็น UTC (initdb อ่านจาก OS ในคอนเทนเนอร์)
    # ต้องสั่งผ่าน command เพราะค่า timezone ถูกเขียนลง postgresql.conf ตั้งแต่ initdb แล้ว
    # การใส่ env TZ ทีหลังไม่เปลี่ยนค่าใน volume เดิม
    # หมายเหตุ: เงื่อนไข SQL ทุกจุดถูกเขียนให้ไม่ขึ้นกับ TimeZone ของ session อยู่แล้ว บรรทัดนี้เป็นกันเหนียว
    # + ทำให้ log/psql อ่านเป็นเวลาไทย ไม่ใช่ตัวที่ความถูกต้องไปพึ่งพา
    command: ["postgres", "-c", "timezone=Asia/Bangkok", "-c", "log_timezone=Asia/Bangkok"]
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: Asia/Bangkok
    volumes:
      # postgres:18 เก็บ data ในซับไดเรกทอรีตาม major version → ต้อง mount ที่ /var/lib/postgresql (พาเรนต์) ไม่ใช่ /data
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # ไม่ publish port 5432 ออก host → app คุยกับ db ผ่าน network ภายในชื่อ "db" เท่านั้น (ปลอดภัย + ไม่ชนโปรเจคอื่น)
    # ถ้าเครื่องไหนต้องต่อ db จากภายนอก (เช่น VSCode DB extension) ให้ publish ใน docker-compose.override.yml ของเครื่องนั้น

  app:
    build: .
    restart: unless-stopped
    # C.4 — tini เป็น PID 1: ส่งต่อ SIGTERM ให้ node (ลูกตรง) + เก็บ zombie process
    # ที่ esbuild ของ tsx ทิ้งไว้ (ของเดิมค้างสะสมเพราะ npm ไม่ได้ทำหน้าที่ init)
    init: true
    # C.4 — docker ให้เวลาหลัง SIGTERM แค่ 10 วิเป็น default แล้ว SIGKILL ทิ้ง
    # ซึ่งสั้นกว่าเวลาที่ข้อความ 1 ตัวใช้ตอบ (งบ 48 วิ) ⇒ ทุก deploy = ข้อความในคิวหายเงียบยกชุด
    # 60 วิ = งบ 48 วิ + เวลาปิด Chrome + เผื่อ · แอปมี hard exit ที่ 55 วิ ตัดหน้าอยู่แล้ว
    # ปกติ restart จะเร็วเหมือนเดิม เพราะ drain คืนค่าทันทีถ้าคิวว่าง — 60 วิคือเพดาน ไม่ใช่เวลาที่รอทุกครั้ง
    stop_grace_period: 60s
    # จำกัดขนาด log ไม่ให้โตไม่จำกัด: เก็บ 5 ไฟล์ ไฟล์ละ 10MB (รวมสูงสุด ~50MB) แล้ว rotate ทับของเก่า
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file: .env
    environment:
      PG_HOST: db          # ชี้ไปที่ service db (override ค่าใน .env)
      PG_PORT: "5432"
      PORT: "3011"
      NODE_ENV: production
      # เวลาท้องถิ่นของ Node = ไทย → log ของแอปอ่านเป็นเวลาไทย
      # โค้ดที่ต้องการ "วันไทย" (วันที่บนหัว PDF, งวด yymm ของเลขใบเสนอราคา) ปัก Asia/Bangkok
      # ไว้ในตัวเองผ่าน utils/thaiTime.ts แล้ว บรรทัดนี้จึงเป็นกันเหนียว ไม่ใช่ตัวที่ความถูกต้องไปพึ่งพา
      TZ: Asia/Bangkok
    depends_on:
      db:
        condition: service_healthy
    # ผูกที่ 127.0.0.1 → เข้าถึงได้เฉพาะ reverse proxy กลางที่รันบน host
    # APP_PORT = พอร์ต host ที่ IT จะ route subdomain มา (ตั้งใน .env; default 3011)
    ports:
      - "127.0.0.1:${APP_PORT:-3011}:3011"
    volumes:
      - sig_sale:/app/data/sale_sigs     # รูปลายเซ็นที่อัปโหลด (คงอยู่ข้าม rebuild)
      - sig_admin:/app/data/admin_sigs

  # HTTPS/subdomain จัดการผ่าน Cloudflare + reverse proxy กลางของ IT → โปรเจคนี้ไม่รัน reverse proxy เอง

volumes:
  pgdata:
  sig_sale:
  sig_admin:
